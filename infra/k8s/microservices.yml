# Fraud Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fraud-service
  template:
    metadata:
      labels:
        app: fraud-service
    spec:
      containers:
        - name: fraud-service
          image: ghcr.io/your-org/fraud-service:latest
          ports:
            - containerPort: 8010
          env:
            - name: PORT
              value: "8010"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: FRAUD_THRESHOLD
              value: "0.7"
          livenessProbe:
            httpGet:
              path: /health
              port: 8010
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: fraud-service
spec:
  selector:
    app: fraud-service
  ports:
    - port: 8010
      targetPort: 8010
