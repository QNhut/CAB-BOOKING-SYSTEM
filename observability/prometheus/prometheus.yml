global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "api-gateway"
    static_configs:
      - targets: ["api-gateway:8000"]
    metrics_path: /metrics

  - job_name: "auth-service"
    static_configs:
      - targets: ["auth-service:8001"]
    metrics_path: /metrics

  - job_name: "pricing-service"
    static_configs:
      - targets: ["pricing-service:8002"]
    metrics_path: /metrics

  - job_name: "booking-service"
    static_configs:
      - targets: ["booking-service:8003"]
    metrics_path: /metrics

  - job_name: "driver-service"
    static_configs:
      - targets: ["driver-service:8004"]
    metrics_path: /metrics

  - job_name: "ride-service"
    static_configs:
      - targets: ["ride-service:8005"]
    metrics_path: /metrics

  - job_name: "notification-service"
    static_configs:
      - targets: ["notification-service:8006"]
    metrics_path: /metrics

  - job_name: "geo-service"
    static_configs:
      - targets: ["geo-service:8007"]
    metrics_path: /metrics

  - job_name: "eta-service"
    static_configs:
      - targets: ["eta-service:8009"]
    metrics_path: /metrics

  - job_name: "fraud-service"
    static_configs:
      - targets: ["fraud-service:8010"]
    metrics_path: /metrics

  - job_name: "review-service"
    static_configs:
      - targets: ["review-service:8011"]
    metrics_path: /metrics

  - job_name: "agent-service"
    static_configs:
      - targets: ["agent-service:8012"]
    metrics_path: /metrics

  - job_name: "user-service"
