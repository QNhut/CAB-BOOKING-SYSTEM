groups:
  - name: cab-booking-alerts
    rules:
      - alert: HighErrorRate
        expr: (sum by (service_name) (rate(http_request_count_total{status_code=~"5.."}[1m])) / clamp_min(sum by (service_name) (rate(http_request_count_total[1m])), 0.000001)) > 0.05
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "High error rate on {{ $labels.service_name }}"
          description: "Error rate > 5% for 30 seconds"

      - alert: HighLatency
        expr: histogram_quantile(0.95, sum by (le, service_name) (rate(request_latency_seconds_bucket[1m]))) > 0.5
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "High P95 latency on {{ $labels.service_name }}"
          description: "P95 latency > 500ms for 30 seconds"

      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
