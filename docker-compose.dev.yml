services:
  pricing-service:
    image: node:20-alpine
    container_name: taxi_pricing_dev
    working_dir: /app
    environment:
      PORT: ${PRICING_PORT}
      OSRM_BASE_URL: ${OSRM_BASE_URL}
      REDIS_URL: ${REDIS_URL}
      TZ: ${TZ}
    ports:
      - "${PRICING_PORT}:${PRICING_PORT}"
    volumes:
      - ./services/pricing-service:/app
      - pricing_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - taxi_net
  booking-service:
    image: node:20-alpine
    container_name: taxi_booking_dev
    working_dir: /app
    environment:
      PORT: ${BOOKING_PORT}
      DATABASE_URL: ${BOOKING_DATABASE_URL}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_BOOKING_TOPIC: ${KAFKA_BOOKING_TOPIC}
      KAFKA_RIDE_TOPIC: ${KAFKA_RIDE_TOPIC}
      JWT_SECRET: ${JWT_SECRET}
      TZ: ${TZ}
    ports:
      - "${BOOKING_PORT}:${BOOKING_PORT}"
    volumes:
      - ./services/booking-service:/app
      - ./shared:/shared
      - booking_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - taxi_net
  booking-worker:
    image: node:20-alpine
    container_name: taxi_booking_worker_dev
    working_dir: /app
    environment:
      DATABASE_URL: ${BOOKING_DATABASE_URL}
      OUTBOX_POLL_MS: ${OUTBOX_POLL_MS}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE}
      TZ: ${TZ}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_BOOKING_TOPIC: ${KAFKA_BOOKING_TOPIC}
      KAFKA_RIDE_TOPIC: ${KAFKA_RIDE_TOPIC}
    volumes:
      - ./services/booking-service:/app
      - booking_node_modules:/app/node_modules
    command: sh -c "npm install && npm run worker"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - taxi_net
  auth-service:
    image: node:20-alpine
    container_name: taxi_auth_dev
    working_dir: /app
    environment:
      PORT: ${AUTH_PORT}
      DATABASE_URL: ${AUTH_DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS}
      TZ: ${TZ}
    ports:
      - "${AUTH_PORT}:${AUTH_PORT}"
    volumes:
      - ./services/auth-service:/app
      - ./shared:/shared
      - auth_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - taxi_net
  postgres:
    image: postgres:16-alpine
    container_name: taxi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taxi_net
  redis:
    image: redis:7-alpine
    container_name: taxi_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - taxi_net
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: taxi_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./infra/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./infra/pgadmin/pgpass:/pgpass:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - taxi_net
  kafka:
    image: apache/kafka:4.1.1
    container_name: taxi_kafka
    restart: unless-stopped
    ports:
      - "9094:9094"  # host access
    environment:
      # KRaft combined mode (broker + controller trong 1 container)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # listeners: 1 cái cho container network, 1 cái cho host
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # dev settings (single node)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - taxi_net
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: taxi_kafka_ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: taxi-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    networks:
      - taxi_net
  kafka-init:
    image: apache/kafka:4.1.1
    container_name: taxi_kafka_init
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Kafka to be ready..."
        sleep 10
        echo "Creating Kafka topics..."
        /opt/kafka/bin/kafka-topics.sh --create --bootstrap-server kafka:9092 --topic taxi.bookings --partitions 3 --replication-factor 1 --if-not-exists
        /opt/kafka/bin/kafka-topics.sh --create --bootstrap-server kafka:9092 --topic taxi.rides --partitions 3 --replication-factor 1 --if-not-exists
        /opt/kafka/bin/kafka-topics.sh --create --bootstrap-server kafka:9092 --topic taxi.payments --partitions 2 --replication-factor 1 --if-not-exists
        echo "Topics created successfully!"
        /opt/kafka/bin/kafka-topics.sh --list --bootstrap-server kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - taxi_net
    restart: "no"
  ride-service:
    image: node:20-alpine
    container_name: taxi_ride_dev
    working_dir: /app
    ports:
      - "${RIDE_PORT:-8005}:${RIDE_PORT:-8005}"
    environment:
      PORT: ${RIDE_PORT:-8005}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_BOOKING_TOPIC: ${KAFKA_BOOKING_TOPIC:-taxi.bookings}
      KAFKA_RIDE_TOPIC: ${KAFKA_RIDE_TOPIC:-taxi.rides}
      KAFKA_GROUP_ID: ${RIDE_GROUP_ID:-ride-service}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      DATABASE_URL: ${RIDE_DATABASE_URL:-postgres://taxi:taxi_pass@postgres:5432/ride_db}
      DRIVER_BASE_URL: ${DRIVER_URL:-http://driver-service:8004}
      BOOKING_BASE_URL: ${BOOKING_URL:-http://booking-service:8003}
      GEO_BASE_URL: ${GEO_URL:-http://geo-service:8007}
      AUTH_BASE_URL: ${AUTH_URL:-http://auth-service:8001}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      OFFER_TIMEOUT_SEC: ${OFFER_TIMEOUT_SEC:-10}
      DRIVER_RETRY_INTERVAL_SEC: ${DRIVER_RETRY_INTERVAL_SEC:-10}
      DRIVER_RETRY_MAX_ATTEMPTS: ${DRIVER_RETRY_MAX_ATTEMPTS:-12}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./services/ride-service:/app
      - ./shared:/shared
      - ride_node_modules:/app/node_modules
    command: sh -c "npm install && node index.js"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - taxi_net

  driver-service:
    image: node:20-alpine
    container_name: taxi_driver_dev
    working_dir: /app
    environment:
      PORT: ${DRIVER_PORT:-8004}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      HB_TTL_SEC: ${HB_TTL_SEC:-60}
      STATE_TTL_SEC: ${STATE_TTL_SEC:-1800}
      JWT_SECRET: ${JWT_SECRET}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - "${DRIVER_PORT:-8004}:${DRIVER_PORT:-8004}"
    volumes:
      - ./services/driver-service:/app
      - ./shared:/shared
      - driver_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - taxi_net
  booking-consumer:
    image: node:20-alpine
    container_name: taxi_booking_consumer
    working_dir: /app
    environment:
      DATABASE_URL: ${BOOKING_DATABASE_URL:-postgres://taxi:taxi_pass@postgres:5432/taxi_main}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_RIDE_TOPIC: ${KAFKA_RIDE_TOPIC:-taxi.rides}
      KAFKA_GROUP_ID: ${BOOKING_CONSUMER_GROUP_ID:-booking-service}
    volumes:
      - ./services/booking-service:/app
      - booking_node_modules:/app/node_modules
    command: sh -c "npm install && node consumer.js"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - taxi_net
  driver-client:
    image: node:20-alpine
    container_name: taxi_driver_client_d1
    working_dir: /app
    environment:
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_RIDE_TOPIC: ${KAFKA_RIDE_TOPIC:-taxi.rides}
      KAFKA_GROUP_ID: ${DRIVER_CLIENT_GROUP_ID:-driver-client}
      DRIVER_ID: ${DRIVER_CLIENT_ID:-d1}
      RIDE_BASE_URL: ${RIDE_URL:-http://ride-service:8005}
    volumes:
      - ./services/driver-client:/app
      - driver_client_node_modules:/app/node_modules
    command: sh -c "npm install kafkajs axios && node index.js"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - taxi_net
  notification-service:
    image: node:20-alpine
    container_name: taxi_notification_dev
    working_dir: /app
    environment:
      PORT: ${NOTIF_PORT:-8006}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_BOOKING_TOPIC: ${KAFKA_BOOKING_TOPIC:-taxi.bookings}
      KAFKA_RIDE_TOPIC: ${KAFKA_RIDE_TOPIC:-taxi.rides}
      KAFKA_PAYMENT_TOPIC: ${KAFKA_PAYMENT_TOPIC:-taxi.payments}
      KAFKA_GROUP_ID: ${NOTIF_GROUP_ID:-notification-service}
      JWT_SECRET: ${JWT_SECRET}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - "${NOTIF_PORT:-8006}:${NOTIF_PORT:-8006}"
    volumes:
      - ./services/notification-service:/app
      - notification_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - taxi_net
  geo-service:
    image: node:20-alpine
    container_name: taxi_geo_dev
    working_dir: /app
    environment:
      PORT: ${GEO_PORT:-8007}
      GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY}
      GEO_DEFAULT_LANG: ${GEO_DEFAULT_LANG:-vi}
      GEO_DEFAULT_COUNTRY: ${GEO_DEFAULT_COUNTRY:-vn}
    ports:
      - "${GEO_PORT:-8007}:${GEO_PORT:-8007}"
    volumes:
      - ./services/geo-service:/app
      - geo_node_modules:/app/node_modules
    command: sh -c "npm install && npm start"
    networks:
      - taxi_net

  payment-service:
    image: node:18-alpine
    container_name: taxi_payment_dev
    working_dir: /app
    environment:
      PORT: ${PAYMENT_PORT:-8888}
      NODE_ENV: ${NODE_ENV:-development}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_PAYMENT_TOPIC: ${KAFKA_PAYMENT_TOPIC:-taxi.payments}
    ports:
      - "${PAYMENT_PORT:-8888}:${PAYMENT_PORT:-8888}"
    volumes:
      - ./services/payment-service:/app
      - payment_node_modules:/app/node_modules
    command: sh -c "npm install && npm start"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - taxi_net

  frontend:
    image: node:20-alpine
    container_name: taxi_frontend_dev
    working_dir: /app
    environment:
      VITE_AUTH_URL: ${VITE_AUTH_URL:-http://localhost:8000}
      VITE_BOOKING_URL: ${VITE_BOOKING_URL:-http://localhost:8000}
      VITE_PRICING_URL: ${VITE_PRICING_URL:-http://localhost:8000}
      VITE_DRIVER_URL: ${VITE_DRIVER_URL:-http://localhost:8000}
      VITE_RIDE_URL: ${VITE_RIDE_URL:-http://localhost:8000}
      VITE_NOTIFICATION_URL: ${VITE_NOTIFICATION_URL:-http://localhost:8000}
      VITE_GEO_URL: ${VITE_GEO_URL:-http://localhost:8000}
      VITE_PAYMENT_URL: ${VITE_PAYMENT_URL:-http://localhost:8000}
      VITE_ETA_URL: ${VITE_ETA_URL:-http://localhost:8000}
      VITE_REVIEW_URL: ${VITE_REVIEW_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./taxi-fe:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    networks:
      - taxi_net

  api-gateway:
    image: node:20-alpine
    container_name: taxi_api_gateway
    working_dir: /app
    environment:
      PORT: ${API_GATEWAY_PORT:-8000}
      AUTH_URL: ${AUTH_URL:-http://auth-service:8001}
      BOOKING_URL: ${BOOKING_URL:-http://booking-service:8003}
      PRICING_URL: ${PRICING_URL:-http://pricing-service:8002}
      DRIVER_URL: ${DRIVER_URL:-http://driver-service:8004}
      RIDE_URL: ${RIDE_URL:-http://ride-service:8005}
      NOTIF_URL: ${NOTIF_URL:-http://notification-service:8006}
      GEO_URL: ${GEO_URL:-http://geo-service:8007}
      PAYMENT_URL: ${PAYMENT_URL:-http://payment-service:8888}
      ETA_URL: ${ETA_URL:-http://eta-service:8009}
      FRAUD_URL: ${FRAUD_URL:-http://fraud-service:8010}
      REVIEW_URL: ${REVIEW_URL:-http://review-service:8011}
      AGENT_URL: ${AGENT_URL:-http://agent-service:8012}
      USER_URL: ${USER_URL:-http://user-service:8013}
    ports:
      - "${API_GATEWAY_PORT:-8000}:${API_GATEWAY_PORT:-8000}"
    volumes:
      - ./api-gateway:/app
      - api_gateway_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    networks:
      - taxi_net

  eta-service:
    image: node:20-alpine
    container_name: taxi_eta_dev
    working_dir: /app
    environment:
      PORT: ${ETA_PORT:-8009}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - "${ETA_PORT:-8009}:${ETA_PORT:-8009}"
    volumes:
      - ./services/eta-service:/app
      - eta_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - taxi_net

  fraud-service:
    image: node:20-alpine
    container_name: taxi_fraud_dev
    working_dir: /app
    environment:
      PORT: ${FRAUD_PORT:-8010}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      FRAUD_THRESHOLD: ${FRAUD_THRESHOLD:-0.7}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - "${FRAUD_PORT:-8010}:${FRAUD_PORT:-8010}"
    volumes:
      - ./services/fraud-service:/app
      - fraud_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - taxi_net

  review-service:
    image: node:20-alpine
    container_name: taxi_review_dev
    working_dir: /app
    environment:
      PORT: ${REVIEW_PORT:-8011}
      DATABASE_URL: ${REVIEW_DATABASE_URL:-postgres://taxi:taxi_pass@postgres:5432/taxi_main}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - "${REVIEW_PORT:-8011}:${REVIEW_PORT:-8011}"
    volumes:
      - ./services/review-service:/app
      - review_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - taxi_net

  agent-service:
    image: node:20-alpine
    container_name: taxi_agent_dev
    working_dir: /app
    environment:
      PORT: ${AGENT_PORT:-8012}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      ETA_URL: ${ETA_URL:-http://eta-service:8009}
      PRICING_URL: ${PRICING_URL:-http://pricing-service:8002}
      FRAUD_URL: ${FRAUD_URL:-http://fraud-service:8010}
      DRIVER_URL: ${DRIVER_URL:-http://driver-service:8004}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - "${AGENT_PORT:-8012}:${AGENT_PORT:-8012}"
    volumes:
      - ./services/agent-service:/app
      - ./shared:/shared
      - agent_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    depends_on:
      - redis
    networks:
      - taxi_net

  user-service:
    image: node:20-alpine
    container_name: taxi_user_dev
    working_dir: /app
    environment:
      PORT: ${USER_PORT:-8013}
      DATABASE_URL: ${USER_DATABASE_URL:-postgres://taxi:taxi_pass@postgres:5432/taxi_main}
      JWT_SECRET: ${JWT_SECRET}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - "${USER_PORT:-8013}:${USER_PORT:-8013}"
    volumes:
      - ./services/user-service:/app
      - ./shared:/shared
      - user_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - taxi_net

  prometheus:
    image: prom/prometheus:latest
    container_name: taxi_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    networks:
      - taxi_net

  grafana:
    image: grafana/grafana:latest
    container_name: taxi_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - taxi_net


networks:
  taxi_net:
    driver: bridge
volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
  pricing_node_modules:
  booking_node_modules:
  auth_node_modules:
  ride_node_modules:
  driver_node_modules:
  driver_client_node_modules:
  notification_node_modules:
  frontend_node_modules:
  api_gateway_node_modules:
  payment_node_modules:
  geo_node_modules:
  eta_node_modules:
  fraud_node_modules:
  review_node_modules:
  agent_node_modules:
  user_node_modules:
  prometheus_data:
  grafana_data:
